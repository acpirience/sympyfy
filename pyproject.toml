[project]
name = "sympyfy"
version = "0.2.0"
description = "A spotify python library."
authors = [
    { name = "Alain", email = "acpirienvce@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "pydantic>=2.6.3"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mkdocs-material>=9.5.1",
    "mkdocstrings[python]>=0.24.0"
]
